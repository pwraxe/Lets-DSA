<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Path Tree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 20px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 { font-size: 1.15rem; font-weight: 600; color: #f8fafc; }
  .controls { display: flex; gap: 10px; }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
  button.danger { background: #ef4444; }
  button.danger:hover { background: #dc2626; }
  button.secondary { background: #64748b; }
  button.secondary:hover { background: #475569; }
  .hint { font-size: 0.8rem; color: #94a3b8; margin-left: auto; }
  #canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0f172a;
    cursor: grab;
  }
  #canvas-container.dragging { cursor: grabbing; }
  canvas { display: block; width: 100%; height: 100%; }
  .legend {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: rgba(30, 41, 59, 0.92);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.78rem;
    color: #cbd5e1;
    border: 1px solid #334155;
    pointer-events: none;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <header>
    <h1>Binary Path Tree (MSB → LSB)</h1>
    <div class="controls">
      <button id="btnRemove" class="danger" disabled>Remove Selected</button>
      <button id="btnReset" class="secondary">Reset</button>
    </div>
    <div class="hint">
      0 / 1 buttons stay under every node that can still accept a child
    </div>
  </header>

  <div id="canvas-container">
    <canvas id="treeCanvas"></canvas>
    <div class="legend">
      <div>Left button / edge = <b>0</b> &nbsp;&nbsp; Right button / edge = <b>1</b></div>
      <div>Buttons remain available until both children exist</div>
    </div>
  </div>

<script>
(() => {
  class Node {
    constructor(parent = null, bit = null) {
      this.parent = parent;
      this.bit = bit;
      this.left = null;
      this.right = null;
      this.x = 0;
      this.y = 0;
      this.id = Node.nextId++;
    }
    get isLeaf() { return !this.left && !this.right; }
    get pathBits() {
      const bits = [];
      let n = this;
      while (n.parent) {
        bits.unshift(n.bit);
        n = n.parent;
      }
      return bits;
    }
    get decimal() {
      const bits = this.pathBits;
      return bits.length ? parseInt(bits.join(''), 2) : null;
    }
  }
  Node.nextId = 0;

  let root = new Node();
  let selected = root;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;
  let isDragging = false;
  let lastMouseX = 0, lastMouseY = 0;
  let buttonHitAreas = [];

  const NODE_R  = 28;
  const LEVEL_H = 130;
  const H_GAP   = 100;
  const BTN_W   = 62;
  const BTN_H   = 28;
  const BTN_GAP = 16;

  const canvas = document.getElementById('treeCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvas-container');

  // ---------- Improved auto-spacing layout (prevents overlapping) ----------
  function layout(node, depth = 0) {
    node.y = depth * LEVEL_H + 70;

    // Leaf node
    if (!node.left && !node.right) {
      // Leaves need extra width because of the two buttons underneath
      node._width = 2.2;          // in "units"
      node.x = 0;                 // temporary, will be shifted later
      return;
    }

    // First layout children
    if (node.left)  layout(node.left,  depth + 1);
    if (node.right) layout(node.right, depth + 1);

    // Calculate this node's width from children
    const leftW  = node.left  ? node.left._width  : 0;
    const rightW = node.right ? node.right._width : 0;

    // Minimum separation between left and right subtrees
    const separation = 1.6;       // good balance (increase if still tight)

    if (node.left && node.right) {
      node._width = leftW + rightW + separation;
      // Position children relative to this node
      node.left.x  = - (rightW + separation) / 2 - leftW / 2;
      node.right.x =   (leftW  + separation) / 2 + rightW / 2;
    } else if (node.left) {
      node._width = leftW + 0.9;
      node.left.x = -0.7;
    } else {
      node._width = rightW + 0.9;
      node.right.x = 0.7;
    }

    node.x = 0; // temporary
  }

  // After the recursive layout we need to convert relative x → absolute x
  function finalizePositions(node, xOffset = 0) {
    node.x = xOffset * H_GAP;

    if (node.left)  finalizePositions(node.left,  xOffset + node.left.x);
    if (node.right) finalizePositions(node.right, xOffset + node.right.x);
  }

  function collectNodes(node, arr = []) {
    if (!node) return arr;
    arr.push(node);
    collectNodes(node.left, arr);
    collectNodes(node.right, arr);
    return arr;
  }

  function centerTree() {
    const nodes = collectNodes(root);
    if (!nodes.length) return;
    const xs = nodes.map(n => n.x);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const treeW = maxX - minX || 100;
    offsetX = (canvas.clientWidth - treeW * scale) / 2 - minX * scale;
    offsetY = 30;
  }

  // ---------- Drawing ----------
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = container.getBoundingClientRect();
    canvas.width  = rect.width  * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width  = rect.width  + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);

    buttonHitAreas = [];
    const nodes = collectNodes(root);

    // edges
    ctx.lineWidth = 2.5 / scale;
    nodes.forEach(n => {
      if (n.left)  drawEdge(n, n.left,  '0');
      if (n.right) drawEdge(n, n.right, '1');
    });

    // nodes
    nodes.forEach(n => drawNode(n));

    // ★★★ KEY CHANGE: buttons under EVERY node that still misses a child ★★★
    nodes.forEach(n => drawAddButtons(n));

    ctx.restore();
  }

  function drawEdge(parent, child, label) {
    ctx.beginPath();
    ctx.strokeStyle = '#64748b';
    ctx.moveTo(parent.x, parent.y + NODE_R - 4);
    ctx.lineTo(child.x, child.y - NODE_R + 4);
    ctx.stroke();

    const mx = (parent.x + child.x) / 2;
    const my = (parent.y + child.y) / 2;
    const side = label === '0' ? -16 : 16;
    ctx.font = `bold ${13 / scale}px system-ui`;
    ctx.fillStyle = '#94a3b8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, mx + side / scale, my);
  }

  function drawNode(node) {
    const isSel = node === selected;
    const isLeaf = node.isLeaf;

    ctx.beginPath();
    ctx.arc(node.x, node.y, NODE_R, 0, Math.PI * 2);

    if (isSel) {
      ctx.fillStyle = '#2563eb';
      ctx.strokeStyle = '#93c5fd';
      ctx.lineWidth = 3.5 / scale;
    } else if (isLeaf) {
      ctx.fillStyle = '#166534';
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 2.8 / scale;
    } else {
      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2.2 / scale;
    }
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (node === root) {
      ctx.font = `bold ${13 / scale}px system-ui`;
      ctx.fillText('root', node.x, node.y);
    } else {
      ctx.font = `bold ${16 / scale}px system-ui`;
      ctx.fillText(String(node.bit), node.x, node.y);
    }

    // decimal only on real leaves (both children missing)
    if (isLeaf && node !== root) {
      ctx.font = `bold ${14 / scale}px system-ui`;
      ctx.fillStyle = '#86efac';
      ctx.fillText(String(node.decimal), node.x, node.y + NODE_R + 22 / scale);

      ctx.font = `${11 / scale}px monospace`;
      ctx.fillStyle = '#64748b';
      ctx.fillText(node.pathBits.join(''), node.x, node.y + NODE_R + 38 / scale);
    }
  }

  // ---------- NEW: show 0 and/or 1 depending on what is still missing ----------
  function drawAddButtons(node) {
    const missingLeft  = !node.left;
    const missingRight = !node.right;
    if (!missingLeft && !missingRight) return;

    // More space between the node and the buttons
    const baseY = node.y + NODE_R + 42;   // ← increased from 18 to 36

    if (missingLeft && missingRight) {
      // both missing → two buttons centered under the node
      const totalW = BTN_W * 2 + BTN_GAP;
      const startX = node.x - totalW / 2;
      drawButton(startX,               baseY, 'add 0', node, 0);
      drawButton(startX + BTN_W + BTN_GAP, baseY, 'add 1', node, 1);
    } else if (missingLeft) {
      // only left missing
      drawButton(node.x - BTN_W - 12, baseY, 'add 0', node, 0);
    } else {
      // only right missing
      drawButton(node.x + 12, baseY, 'add 1', node, 1);
    }
  }

  function drawButton(x, y, label, node, bit) {
    ctx.beginPath();
    roundRect(ctx, x, y, BTN_W, BTN_H, 7);
    ctx.fillStyle = bit === 0 ? '#1d4ed8' : '#7c3aed';
    ctx.fill();
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5 / scale;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${12 / scale}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + BTN_W / 2, y + BTN_H / 2);

    buttonHitAreas.push({ node, bit, x, y, w: BTN_W, h: BTN_H });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  // ---------- Interaction ----------
  function screenToWorld(sx, sy) {
    return { x: (sx - offsetX) / scale, y: (sy - offsetY) / scale };
  }

  function hitTestNode(sx, sy) {
    const p = screenToWorld(sx, sy);
    const nodes = collectNodes(root);
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      const dx = p.x - n.x, dy = p.y - n.y;
      if (dx * dx + dy * dy <= NODE_R * NODE_R) return n;
    }
    return null;
  }

  function hitTestButton(sx, sy) {
    const p = screenToWorld(sx, sy);
    for (const b of buttonHitAreas) {
      if (p.x >= b.x && p.x <= b.x + b.w &&
          p.y >= b.y && p.y <= b.y + b.h) return b;
    }
    return null;
  }

  function updateUI() {
    document.getElementById('btnRemove').disabled = !selected || selected === root;
  }

  function addChild(parent, bit) {
    if (bit === 0 && parent.left)  return;
    if (bit === 1 && parent.right) return;

    const child = new Node(parent, bit);
    if (bit === 0) parent.left  = child;
    else           parent.right = child;

    selected = child;
    relayout(true);
  }

  function removeSelected() {
    if (!selected || selected === root) return;
    const p = selected.parent;
    if (selected.bit === 0) p.left  = null;
    else                    p.right = null;
    selected = p;
    relayout(true);
  }

  function reset() {
    root = new Node();
    selected = root;
    scale = 1;
    relayout(true);
  }

  function relayout(doCenter = false) {
    // 1. Compute relative positions + widths
    layout(root);

    // 2. Convert relative → absolute coordinates
    finalizePositions(root, 0);

    // 3. Center the whole tree
    if (doCenter) centerTree();

    updateUI();
    draw();
  }

  // Events
  document.getElementById('btnRemove').addEventListener('click', removeSelected);
  document.getElementById('btnReset').addEventListener('click', reset);

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;

    const btn = hitTestButton(sx, sy);
    if (btn) {
      addChild(btn.node, btn.bit);
      return;
    }

    const n = hitTestNode(sx, sy);
    if (n) {
      selected = n;
      updateUI();
      draw();
    }
  });

  // Pan
  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    container.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    offsetX += e.clientX - lastMouseX;
    offsetY += e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    draw();
  });
  window.addEventListener('mouseup', () => {
    isDragging = false;
    container.classList.remove('dragging');
  });

  // Zoom
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const before = screenToWorld(mx, my);
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    scale = Math.min(2.5, Math.max(0.35, scale * factor));
    offsetX = mx - before.x * scale;
    offsetY = my - before.y * scale;
    draw();
  }, { passive: false });

  // Touch support
  let lastTouchDist = 0;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastTouchDist = Math.hypot(dx, dy);
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      offsetX += e.touches[0].clientX - lastMouseX;
      offsetY += e.touches[0].clientY - lastMouseY;
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
      draw();
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      if (lastTouchDist > 0) {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        const before = screenToWorld(mx, my);
        scale = Math.min(2.5, Math.max(0.35, scale * (dist / lastTouchDist)));
        offsetX = mx - before.x * scale;
        offsetY = my - before.y * scale;
        draw();
      }
      lastTouchDist = dist;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    isDragging = false;
    lastTouchDist = 0;
  });

  window.addEventListener('resize', () => {
    resize();
    centerTree();
    draw();
  });

  // Init
  resize();
  relayout(true);
})();
</script>
</body>
</html>
